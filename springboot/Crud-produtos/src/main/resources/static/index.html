<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CRUD Produtos</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 920px; margin: 24px auto; padding: 0 12px; }
    h1 { margin-bottom: 8px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    label { display:block; font-size: 12px; margin-bottom: 4px; color: #333; }
    input { padding: 10px; width: 260px; }
    button { padding: 10px 14px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f5f5f5; }
    .actions { display: flex; gap: 8px; }
    .muted { color: #666; font-size: 12px; }
    .error { color: #b00020; white-space: pre-wrap; }
    .ok { color: #0a7a0a; white-space: pre-wrap; }
    .card { border: 1px solid #ddd; padding: 12px; border-radius: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>CRUD Produtos</h1>
  <div class="muted">Backend: <code>/produtos</code></div>

  <div class="card">
    <h2 id="formTitle">Novo produto</h2>

    <div class="row">
      <div>
        <label for="nome">Nome</label>
        <input id="nome" placeholder="Ex: Teclado mecânico"/>
      </div>

      <div>
        <label for="preco">Preço</label>
        <input id="preco" type="number" step="0.01" placeholder="Ex: 199.90"/>
      </div>

      <div>
        <button id="btnSalvar" onclick="salvar()">Salvar</button>
        <button id="btnCancelar" onclick="cancelarEdicao()" style="display:none;">Cancelar</button>
      </div>
    </div>

    <div id="msg" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <h2 style="margin:0;">Lista</h2>
      <div class="actions">
        <button onclick="listar()">Recarregar</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:80px;">ID</th>
          <th>Nome</th>
          <th style="width:140px;">Preço</th>
          <th style="width:220px;">Ações</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="4" class="muted">Carregando...</td></tr>
      </tbody>
    </table>
  </div>

<script>
  // Ajuste aqui se sua rota for diferente:
  const BASE = "/produtos";

  let editId = null;

  function setMsgOk(text) {
    document.getElementById("msg").innerHTML = `<div class="ok">${escapeHtml(text)}</div>`;
  }
  function setMsgErr(text) {
    document.getElementById("msg").innerHTML = `<div class="error">${escapeHtml(text)}</div>`;
  }
  function clearMsg() {
    document.getElementById("msg").innerHTML = "";
  }
  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function formToPayload() {
    const nome = document.getElementById("nome").value.trim();
    const precoStr = document.getElementById("preco").value;

    if (!nome) throw new Error("Informe o nome.");
    if (precoStr === "" || Number(precoStr) <= 0) throw new Error("Informe um preço válido (> 0).");

    // DTO esperado: { nome, preco }
    return { nome, preco: Number(precoStr) };
  }

  function fillForm(p) {
    document.getElementById("nome").value = p.nome ?? "";
    document.getElementById("preco").value = p.preco ?? "";
  }

  function setEditing(on, id=null) {
    editId = on ? id : null;
    document.getElementById("formTitle").textContent = on ? `Editar produto #${id}` : "Novo produto";
    document.getElementById("btnCancelar").style.display = on ? "inline-block" : "none";
    document.getElementById("btnSalvar").textContent = on ? "Atualizar" : "Salvar";
  }

  function cancelarEdicao() {
    setEditing(false);
    fillForm({nome:"", preco:""});
    clearMsg();
  }

  async function listar() {
    clearMsg();
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = `<tr><td colspan="4" class="muted">Carregando...</td></tr>`;

    try {
      const r = await fetch(BASE);
      if (!r.ok) throw new Error(await r.text());

      const data = await r.json();
      if (!Array.isArray(data) || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="muted">Nenhum produto cadastrado.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(p => `
        <tr>
          <td>${escapeHtml(p.id)}</td>
          <td>${escapeHtml(p.nome)}</td>
          <td>${escapeHtml(p.preco)}</td>
          <td>
            <div class="actions">
              <button onclick="editar(${p.id})">Editar</button>
              <button onclick="remover(${p.id})">Excluir</button>
            </div>
          </td>
        </tr>
      `).join("");

    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="4" class="error">Erro ao listar: ${escapeHtml(e.message || e)}</td></tr>`;
    }
  }

  async function salvar() {
    clearMsg();
    try {
      const payload = formToPayload();

      if (editId == null) {
        // CREATE
        const r = await fetch(BASE, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(payload)
        });
        if (!r.ok) throw new Error(await r.text());
        setMsgOk("Produto criado com sucesso!");
      } else {
        // UPDATE
        const r = await fetch(`${BASE}/${editId}`, {
          method: "PUT",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(payload)
        });
        if (!r.ok) throw new Error(await r.text());
        setMsgOk("Produto atualizado com sucesso!");
      }

      cancelarEdicao();
      await listar();

    } catch (e) {
      setMsgErr(e.message || e);
    }
  }

  async function editar(id) {
    clearMsg();
    try {
      const r = await fetch(`${BASE}/${id}`);
      if (!r.ok) throw new Error(await r.text());
      const p = await r.json();

      setEditing(true, id);
      fillForm(p);

    } catch (e) {
      setMsgErr("Erro ao carregar produto: " + (e.message || e));
    }
  }

  async function remover(id) {
    clearMsg();
    if (!confirm(`Deseja excluir o produto #${id}?`)) return;

    try {
      const r = await fetch(`${BASE}/${id}`, { method: "DELETE" });
      if (!r.ok) throw new Error(await r.text());
      setMsgOk("Produto removido com sucesso!");
      await listar();
    } catch (e) {
      setMsgErr("Erro ao remover: " + (e.message || e));
    }
  }

  // auto load
  listar();
</script>
</body>
</html>
